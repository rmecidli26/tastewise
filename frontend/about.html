<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tastewise by AFA</title>
  <meta name="description" content="Tastewise by AFA — find dishes at AFA Restaurant by your favorite ingredients and budget." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="about" data-title="title.about">
  <header class="site-header"></header>

  <main>
    <section class="hero">
      <div class="hero-art"><img src="images/site/hero-dish.jpg" alt="" /></div>
      <div class="hero-cream" aria-hidden="true"></div>
      <div class="leaves l-tl"></div>
      <div class="container hero-wrap">
        <div class="hero-inner" style="min-height:460px">
          <div class="hero-copy">
            <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M16 3c-2 1.5-3 4-3 7h3v11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="about.badge"></span></span>
            <h1 data-i18n-html="about.title"></h1>
            <p class="lead" data-i18n="about.lead"></p>
            <a href="#story" class="btn btn-primary"><span data-i18n="about.cta"></span> <svg class="arrow" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
          </div>
        </div>
      </div>
    </section>

    <section class="section" id="story">
      <div class="leaves l-br"></div>
      <div class="container story-grid">
        <div class="story-text">
          <span class="tag" data-i18n="about.storyTag"></span>
          <h2 data-i18n="about.storyTitle"></h2>
          <p data-i18n="about.p1"></p>
          <p data-i18n-html="about.p2"></p>
          <p data-i18n-html="about.p3"></p>
          <div class="goal"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><path d="M12 12l7-7M16 5h3v3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><div><strong data-i18n="about.goalTitle"></strong><span data-i18n="about.goalText"></span></div></div>
          <p class="motto" data-i18n="footer.tagline"></p>
        </div>
        <div class="collage">
          <img src="images/site/story-tomatoes.jpg" data-i18n-attr="alt:about.storyImg1" alt="" loading="lazy" />
          <img class="tall" src="images/site/story-apron.jpg" data-i18n-attr="alt:about.storyImg3" alt="" loading="lazy" />
          <img src="images/site/story-salad.jpg" data-i18n-attr="alt:about.storyImg2" alt="" loading="lazy" />
        </div>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="container mission-grid">
        <div class="mission-card">
          <svg class="hat" viewBox="0 0 48 48" aria-hidden="true"><path d="M14 30c-5 0-8-3.6-8-8s3.6-8 8-8c1 0 1.8.1 2.6.4C18 10.6 20.8 8 24 8s6 2.6 7.4 6.4c.8-.3 1.6-.4 2.6-.4 4.4 0 8 3.6 8 8s-3 8-8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M14 26v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M14 34h20" stroke="currentColor" stroke-width="3"/></svg>
          <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M16 3c-2 1.5-3 4-3 7h3v11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="about.missionTag"></span></span>
          <h2 data-i18n="about.missionTitle"></h2>
          <p data-i18n="about.missionText"></p>
          <span class="script" data-i18n="footer.tagline"></span>
        </div>
        <div>
          <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M16 3c-2 1.5-3 4-3 7h3v11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="about.whyTag"></span></span>
          <h2 style="font-size:clamp(2rem,3.5vw,2.6rem);margin:.8rem 0 1.4rem" data-i18n="about.whyTitle"></h2>
          <div class="feature-grid">
            <div class="feature"><div class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div><h3 data-i18n="why.1t"></h3><p data-i18n="why.1d"></p></div><div class="feature"><div class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a1 1 0 0 1-1-1V7zM4 7l11-3v3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="16" cy="13.5" r="1.3" fill="currentColor"/></svg></div><h3 data-i18n="why.2t"></h3><p data-i18n="why.2d"></p></div><div class="feature"><div class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></div><h3 data-i18n="why.3t"></h3><p data-i18n="why.3d"></p></div><div class="feature"><div class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div><h3 data-i18n="why.4t"></h3><p data-i18n="why.4d"></p></div>
          </div>
        </div>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="container meet-grid">
        <div class="blob-img"><img src="images/site/interior.jpg" data-i18n-attr="alt:visit.imgAlt" alt="" loading="lazy" /></div>
        <div>
          <span class="tag" data-i18n="about.meetTag"></span>
          <h2 style="font-size:clamp(2rem,3.5vw,2.6rem);margin:.8rem 0 1rem">AFA Restaurant</h2>
          <p data-restaurant="description"></p>
          <a href="explore.html" class="btn btn-primary" style="margin:.4rem 0 1.8rem"><span data-i18n="visit.explore"></span> <svg class="arrow" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
          <ul class="contact-list">
            <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="9.5" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><div><strong data-i18n="info.address"></strong><span data-restaurant="address"></span></div></li>
            <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 6 6L15 14l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><div><strong data-i18n="info.contact"></strong><a data-restaurant="phone" href="tel:+994501234567">+994 50 123 45 67</a></div></li>
            <li><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><div><strong data-i18n="info.hours"></strong><span data-restaurant="hours"></span></div></li>
          </ul>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer"></footer>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/about.js"></script>
</body>
</html>
