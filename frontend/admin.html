<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tastewise by AFA</title>
  <meta name="description" content="Tastewise by AFA — find dishes at AFA Restaurant by your favorite ingredients and budget." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="admin" data-title="title.admin">
  <header class="site-header"></header>

  <main>
    <section class="page-banner">
      <div class="container">
        <p class="crumbs" data-i18n="admin.crumb"></p>
        <h1 data-i18n="admin.h1"></h1>
        <p class="muted" data-i18n="admin.sub"></p>
      </div>
    </section>
    <section class="section" style="padding-top:.5rem">
      <div class="container">
        <div class="toolbar">
          <div class="chips" id="statusChips">
            <button type="button" class="chip" data-value="pending" aria-pressed="true" data-i18n="status.pending"></button>
            <button type="button" class="chip" data-value="confirmed" aria-pressed="false" data-i18n="status.confirmed"></button>
            <button type="button" class="chip" data-value="declined" aria-pressed="false" data-i18n="status.declined"></button>
            <button type="button" class="chip" data-value="cancelled" aria-pressed="false" data-i18n="status.cancelled"></button>
            <button type="button" class="chip" data-value="all" aria-pressed="false" data-i18n="admin.all"></button>
          </div>
          <label class="check"><input type="checkbox" id="upcomingOnly" checked /> <span data-i18n="admin.upcoming"></span></label>
        </div>
        <div class="table-wrap"><table class="table">
          <thead><tr><th data-i18n="admin.when"></th><th data-i18n="admin.guest"></th><th data-i18n="admin.party"></th><th data-i18n="admin.note"></th><th data-i18n="admin.status"></th><th data-i18n="admin.actions"></th></tr></thead>
          <tbody id="adminRows"></tbody>
        </table></div>
      </div>
    </section>
  </main>

  <footer class="site-footer"></footer>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
