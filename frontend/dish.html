<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tastewise by AFA</title>
  <meta name="description" content="Tastewise by AFA — find dishes at AFA Restaurant by your favorite ingredients and budget." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="dish" data-title="title.dish" data-nav="explore">
  <header class="site-header"></header>

  <main>
    <section class="section" style="padding-top:1.5rem">
      <div class="leaves l-br"></div>
      <div class="container dish-page" id="dishRoot">
        <div class="gallery-col" id="galleryCol"></div>
        <div class="dish-info" id="infoCol"></div>
        <aside class="reviews-panel" id="reviewsCol">
          <h2 data-i18n="reviews.title"></h2>
          <div class="review-summary" id="reviewSummary"></div>
          <div class="review-list" id="reviewList"></div>
          <div class="load-more" style="margin-top:1rem"><button type="button" class="btn btn-ghost btn-sm" id="moreReviews" hidden data-i18n="reviews.more"></button></div>
          <div id="reviewFormSlot"></div>
        </aside>
      </div>
    </section>
  </main>

  <footer class="site-footer"></footer>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/dish.js"></script>
</body>
</html>
