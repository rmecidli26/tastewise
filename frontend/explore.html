<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tastewise by AFA</title>
  <meta name="description" content="Tastewise by AFA — find dishes at AFA Restaurant by your favorite ingredients and budget." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="explore" data-title="title.explore">
  <header class="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="page-hero-art" aria-hidden="true"><img src="images/site/story-tomatoes.jpg" alt="" /></div>
      <div class="leaves l-bl"></div>
      <div class="container">
        <h1 data-i18n="explore.title"></h1>
        <p class="lead" data-i18n="explore.sub"></p>
        <form class="searchbar" id="searchForm" role="search">
            <div class="ing-picker" id="ingPicker"></div>
            <label class="budget"><span class="sr-only" data-i18n="search.budgetLabel"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a1 1 0 0 1-1-1V7zM4 7l11-3v3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="16" cy="13.5" r="1.3" fill="currentColor"/></svg><select id="budgetSelect"></select></label>
            <button type="submit" class="btn btn-primary" id="findBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span data-i18n="cta.find"></span></button>
          </form>
      </div>
    </section>

    <section class="section" style="padding-top:1rem">
      <div class="container explore-layout">
        <aside class="filter-panel" id="filterPanel" data-i18n-attr="aria-label:filters.title">
          <div class="panel-head">
            <h2 data-i18n="filters.title"></h2>
            <button type="button" class="btn-text" id="clearFilters" data-i18n="filters.clear"></button>
            <button type="button" class="btn btn-ghost btn-sm panel-close" id="closeFilters" data-i18n="filters.done"></button>
          </div>
          <div class="filter-group">
            <h3 data-i18n="filters.price"></h3>
            <div class="range2" id="priceRange">
              <div class="track"></div><div class="fill" id="priceFill"></div>
              <input type="range" id="minPrice" min="0" max="30" step="0.5" value="0" data-i18n-attr="aria-label:filters.price" />
              <input type="range" id="maxPrice" min="0" max="30" step="0.5" value="30" data-i18n-attr="aria-label:filters.price" />
            </div>
            <div class="range-values"><span id="minPriceOut"></span><span id="maxPriceOut"></span></div>
          </div>
          <div class="filter-group">
            <h3 data-i18n="filters.category"></h3>
            <div id="categoryChecks"></div>
          </div>
          <div class="filter-group">
            <h3 data-i18n="filters.diet"></h3>
            <label class="check"><input type="checkbox" id="vegOnly" /> <span data-i18n="diet.vegetarian"></span></label>
            <label class="check"><input type="checkbox" id="mildOnly" /> <span data-i18n="filters.notSpicy"></span></label>
          </div>
          <div class="filter-group">
            <h3 data-i18n="filters.rating"></h3>
            <label class="check"><input type="radio" name="rating" value="" checked /> <span data-i18n="filters.ratingAny"></span></label>
            <label class="check"><input type="radio" name="rating" value="4.5" /> <span class="stars-row">★★★★★</span> <span data-rating-label="4.5"></span></label>
            <label class="check"><input type="radio" name="rating" value="4" /> <span class="stars-row">★★★★☆</span> <span data-rating-label="4"></span></label>
            <label class="check"><input type="radio" name="rating" value="3" /> <span class="stars-row">★★★☆☆</span> <span data-rating-label="3"></span></label>
          </div>
          <div class="filter-group">
            <h3><label for="exclude" data-i18n="filters.exclude"></label></h3>
            <input class="input" id="exclude" list="ingredientList" data-i18n-attr="placeholder:filters.excludePh" autocomplete="off" />
            <p class="hint" style="margin:.4rem 0 0" data-i18n="filters.groups"></p>
            <datalist id="ingredientList"></datalist>
          </div>
        </aside>

        <div>
          <div class="results-bar">
            <div>
              <h2 id="resultsTitle"></h2>
              <p id="resultCount" aria-live="polite"></p>
            </div>
            <div style="display:flex;gap:.6rem;align-items:center">
              <button type="button" class="btn btn-ghost btn-sm filters-toggle" id="openFilters" data-i18n="filters.open"></button>
              <label class="sort"><span data-i18n="results.sortLabel"></span>
                <select id="sort">
                  <option value="match" data-i18n="sort.match"></option>
                  <option value="popular" data-i18n="sort.popular"></option>
                  <option value="price_asc" data-i18n="sort.price_asc"></option>
                  <option value="price_desc" data-i18n="sort.price_desc"></option>
                  <option value="name" data-i18n="sort.name"></option>
                </select>
              </label>
            </div>
          </div>
          <div class="menu-tabs" id="menuTabs" role="tablist" data-i18n-attr="aria-label:explore.sections"></div>
          <div class="menu-sections" id="menuSections"></div>
          <div class="dish-grid cols-3" id="resultsGrid" hidden></div>
          <div class="load-more"><button type="button" class="btn btn-ghost" id="loadMore" hidden data-i18n="results.more"></button></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer"></footer>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/explore.js"></script>
</body>
</html>
