<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tastewise by AFA</title>
  <meta name="description" content="Tastewise by AFA — find dishes at AFA Restaurant by your favorite ingredients and budget." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="favorites" data-title="title.favorites">
  <header class="site-header"></header>

  <main>
    <section class="section" style="padding-top:1.5rem">
      <div class="leaves l-tr"></div>
      <div class="container fav-layout">
        <div>
          <h1 style="font-size:clamp(2.4rem,5vw,3.4rem)" data-i18n="fav.title"></h1>
          <p class="lead" style="font-size:1.12rem;margin:.4rem 0 2rem"><span data-i18n="fav.sub"></span> <span aria-hidden="true" style="color:var(--burgundy)">♡</span></p>
          <div class="dish-grid cols-3" id="favGrid"></div>
        </div>
        <aside class="mood-card" aria-hidden="true">
          <p data-i18n-html="fav.quote"></p>
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M14 30c-5 0-8-3.6-8-8s3.6-8 8-8c1 0 1.8.1 2.6.4C18 10.6 20.8 8 24 8s6 2.6 7.4 6.4c.8-.3 1.6-.4 2.6-.4 4.4 0 8 3.6 8 8s-3 8-8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M14 26v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M14 34h20" stroke="currentColor" stroke-width="3"/></svg>
        </aside>
      </div>
    </section>
  </main>

  <footer class="site-footer"></footer>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/favorites.js"></script>
</body>
</html>
