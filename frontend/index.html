<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tastewise by AFA</title>
  <meta name="description" content="Tastewise by AFA — find dishes at AFA Restaurant by your favorite ingredients and budget." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="home" data-title="title.home">
  <header class="site-header"></header>

  <main>
    <section class="hero">
      <div class="hero-art"><img src="images/site/hero-dish.jpg" data-i18n-attr="alt:home.imgAlt" alt="" fetchpriority="high" /></div>
      <div class="hero-cream" aria-hidden="true"></div>
      <div class="leaves l-bl"></div>
      <div class="container hero-wrap">
        <div class="hero-inner">
          <div class="hero-copy">
            <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M16 3c-2 1.5-3 4-3 7h3v11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="home.badge"></span></span>
            <h1 data-i18n-html="home.title"></h1>
            <p class="lead" data-i18n="home.lead"></p>
          </div>
          <form class="searchbar" id="searchForm" role="search">
            <div class="ing-picker" id="ingPicker"></div>
            <label class="budget"><span class="sr-only" data-i18n="search.budgetLabel"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a1 1 0 0 1-1-1V7zM4 7l11-3v3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="16" cy="13.5" r="1.3" fill="currentColor"/></svg><select id="budgetSelect"></select></label>
            <button type="submit" class="btn btn-primary" id="findBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span data-i18n="cta.find"></span></button>
          </form>
        </div>
        <aside class="qr-card" aria-labelledby="qrTitle">
          <div class="qr-code" id="qrCode"></div>
          <div class="qr-text">
            <strong id="qrTitle" data-i18n="qr.title"></strong>
            <span data-i18n="qr.text"></span>
            <a class="qr-url" id="qrUrl" href="/"></a>
          </div>
        </aside>
      </div>
    </section>

    <section class="section" style="padding-top:2.5rem">
      <div class="leaves l-br"></div>
      <div class="container">
        <div class="row-head">
          <h2 data-i18n="home.popular"></h2>
          <span class="line"></span>
          <a href="explore.html?sort=popular"><span data-i18n="home.viewAll"></span> <svg class="arrow" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        </div>
        <div class="dish-grid" id="popularGrid"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer"></footer>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/qrcode.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
