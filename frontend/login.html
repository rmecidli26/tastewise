<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tastewise by AFA</title>
  <meta name="description" content="Tastewise by AFA — find dishes at AFA Restaurant by your favorite ingredients and budget." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="login" data-title="title.login" data-nav="account" class="has-photo-header">
  <header class="site-header"></header>
  <main>
    <section class="photo-hero dark auth-hero">
      <div class="bg"><img src="images/site/table-flowers.jpg" alt="" fetchpriority="high" /></div>
      <div class="container">
        <div class="hero-content">
          <h1 data-i18n="login.heroTitle"></h1>
          <p class="lead" data-i18n="login.heroSub"></p>
          <span class="hero-flourish" aria-hidden="true"></span>
        </div>
      </div>
      <div class="wave-bottom"><svg viewBox="0 0 1440 70" preserveAspectRatio="none" aria-hidden="true"><path d="M0 70V40C260 0 520 8 760 34s470 30 680 0v36z" fill="currentColor"/></svg></div>
    </section>
    <section class="section auth-section">
      <div class="leaves l-tl"></div><div class="leaves l-br"></div>
      <div class="container">
        <div class="auth-box">
          <div class="auth-hat"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M14 30c-5 0-8-3.6-8-8s3.6-8 8-8c1 0 1.8.1 2.6.4C18 10.6 20.8 8 24 8s6 2.6 7.4 6.4c.8-.3 1.6-.4 2.6-.4 4.4 0 8 3.6 8 8s-3 8-8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M14 26v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M14 34h20" stroke="currentColor" stroke-width="3"/></svg></div>
          <h2 data-i18n="login.h1"></h2>
          <p class="auth-sub" data-i18n="login.sub"></p>
          <form class="form" id="loginForm" novalidate>
            <div class="form-msg" id="formMsg" hidden></div>
          <div class="form-field">
            <label class="sr-only" for="email" data-i18n="f.email"></label>
            <div class="field-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><input class="input" type="email" id="email" name="email" autocomplete="email" required data-i18n-attr="placeholder:f.email" /></div>
            <span class="field-error"></span>
          </div>
          <div class="form-field">
            <label class="sr-only" for="password" data-i18n="f.password"></label>
            <div class="field-icon pw-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="15.5" r="1.3" fill="currentColor"/></svg><input class="input" type="password" id="password" name="password" autocomplete="current-password" required data-i18n-attr="placeholder:f.password" /><button type="button" class="pw-toggle pw-eye" aria-pressed="false" data-i18n-attr="aria-label:pw.show"><svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 4l16 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></div>
            <span class="field-error"></span>
          </div>
            <div class="auth-row">
              <label class="check"><input type="checkbox" id="remember" name="remember" /> <span data-i18n="login.remember"></span></label>
              <a class="link" href="forgot.html" data-i18n="login.forgot"></a>
            </div>
            <button type="submit" class="btn btn-primary btn-lg btn-block"><span data-i18n="login.submit"></span> <svg class="arrow" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </form>
          <p class="auth-switch"><span data-i18n="login.new"></span> <a class="link" href="register.html" id="toRegister" data-i18n="login.create"></a></p>
        </div>
      </div>
    </section>
    <section class="section" style="padding-top:0">
      <div class="container">
        <div class="info-bar light">
          <div class="info-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="9.5" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><div><strong data-i18n="info.address"></strong><span data-restaurant="address">Sumqayıt, Azərbaycan</span></div></div>
          <div class="info-item"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><div><strong data-i18n="info.hours"></strong><span data-restaurant="hours"></span></div></div>
          <div class="info-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 6 6L15 14l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><div><strong data-i18n="info.contact"></strong><a data-restaurant="phone" href="tel:+994501234567">+994 50 123 45 67</a></div></div>
          <p class="welcome"><span data-i18n="reserve.welcome"></span> <span aria-hidden="true">♡</span></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer"></footer>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
