<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tastewise by AFA</title>
  <meta name="description" content="Tastewise by AFA — find dishes at AFA Restaurant by your favorite ingredients and budget." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="order" data-title="title.order">
  <header class="site-header"></header>

  <main>
    <section class="section" style="padding-top:1.5rem">
      <div class="leaves l-tr"></div>
      <div class="container">
        <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span data-i18n="order.badge"></span></span>
        <h1 class="order-h1" data-i18n="order.title"></h1>
        <p class="lead order-lead" data-i18n="order.sub"></p>

        <div class="order-layout" id="orderRoot">
          <section class="order-cart" aria-labelledby="cartHead">
            <div class="order-cart-head">
              <h2 id="cartHead"><span data-i18n="order.dish"></span> <span class="muted" id="itemCount"></span></h2>
              <button type="button" class="btn-text" id="clearCart" data-i18n="order.clear"></button>
            </div>
            <div class="order-cols" aria-hidden="true">
              <span data-i18n="order.dish"></span><span data-i18n="order.price"></span><span data-i18n="order.qty"></span><span data-i18n="order.sum"></span><span></span>
            </div>
            <ul class="order-list" id="orderList"></ul>
          </section>

          <aside class="checkout">
            <div class="co-card">
              <div id="orderGate"></div>
              <form class="form co-form" id="orderForm" novalidate hidden>
                <div class="form-msg" id="orderMsg" hidden></div>

                <section class="co-step">
                  <h3><span class="co-num">1</span><span data-i18n="order.how"></span></h3>
                  <div class="tiles-2" role="radiogroup" data-i18n-attr="aria-label:order.how">
                    <label class="tile"><input type="radio" name="fulfillment" value="pickup" checked /><span class="tile-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v10h16V10M3 10l1.5-6h15L21 10M3 10c0 1.7 1.3 3 3 3s3-1.3 3-3c0 1.7 1.3 3 3 3s3-1.3 3-3c0 1.7 1.3 3 3 3s3-1.3 3-3M10 20v-5h4v5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span><span class="tile-text"><strong data-i18n="order.pickup"></strong><small data-i18n="order.pickupHint"></small></span></label>
                    <label class="tile"><input type="radio" name="fulfillment" value="delivery" /><span class="tile-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="17" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="18" cy="17" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 17h7M15 6h2l2.5 8.5M3 13h7l2-4h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="tile-text"><strong data-i18n="order.deliveryOpt"></strong><small data-i18n="order.deliveryHint"></small></span></label>
                  </div>
                  <div class="form-field" id="addressField" hidden>
                    <label for="address" data-i18n="order.address"></label>
                    <textarea class="textarea" id="address" name="address" rows="2" maxlength="300" autocomplete="street-address" data-i18n-attr="placeholder:order.addressPh"></textarea>
                    <span class="field-error"></span>
                  </div>
                </section>

                <section class="co-step">
                  <h3><span class="co-num">2</span><span data-i18n="order.whenTitle"></span></h3>
                  <div class="tiles-2" role="radiogroup" data-i18n-attr="aria-label:order.whenTitle">
                    <label class="tile"><input type="radio" name="when" value="asap" checked /><span class="tile-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3L5 13h6l-1 8 8-10h-6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span><span class="tile-text"><strong data-i18n="order.asap"></strong><small data-i18n="order.asapHint"></small></span></label>
                    <label class="tile"><input type="radio" name="when" value="later" /><span class="tile-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span><span class="tile-text"><strong data-i18n="order.later"></strong><small data-i18n="order.laterHint"></small></span></label>
                  </div>
                  <div class="time-picker" id="timeField" hidden>
                    <div class="day-switch" role="radiogroup" data-i18n-attr="aria-label:order.dayLabel">
                      <label><input type="radio" name="day" value="today" checked /><span data-i18n="order.today"></span></label>
                      <label><input type="radio" name="day" value="tomorrow" /><span data-i18n="order.tomorrow"></span></label>
                    </div>
                    <p class="hint slots-empty" id="slotsEmpty" hidden data-i18n="order.noSlotsToday"></p>
                    <div class="slot-chips" id="slotChips" role="group" data-i18n-attr="aria-label:order.quickTimes"></div>
                    <div class="form-field time-type">
                      <label for="time" data-i18n="order.typeTime"></label>
                      <div class="time-input">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                        <input class="input" type="time" id="time" name="time" step="300" min="10:00" max="22:30" />
                      </div>
                      <span class="hint" id="timeHint"></span>
                      <span class="field-error" id="timeError"></span>
                    </div>
                  </div>
                </section>

                <section class="co-step">
                  <h3><span class="co-num">3</span><span data-i18n="order.contactTitle"></span></h3>
                  <div class="form-field">
                    <label for="phone" data-i18n="order.phone"></label>
                    <input class="input" type="tel" id="phone" name="phone" autocomplete="tel" placeholder="+994 50 123 45 67" required />
                    <span class="field-error"></span>
                  </div>
                  <div class="form-field">
                    <label for="note" data-i18n="order.note"></label>
                    <textarea class="textarea" id="note" name="note" rows="2" maxlength="500" data-i18n-attr="placeholder:order.notePh"></textarea>
                    <span class="field-error"></span>
                  </div>
                </section>

                <section class="co-step">
                  <h3><span class="co-num">4</span><span data-i18n="order.payTitle"></span></h3>
                  <div class="tiles-3" role="radiogroup" data-i18n-attr="aria-label:order.payTitle">
                    <span id="onlineTile"><label class="tile"><input type="radio" name="payment" value="online" /><span class="tile-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M2.5 9.5h19M6 15h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span><span class="tile-text"><strong data-i18n="order.online"></strong><small data-i18n="order.onlineHint"></small></span></label></span>
                    <label class="tile"><input type="radio" name="payment" value="cash" checked /><span class="tile-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.8" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span><span class="tile-text"><strong data-i18n="order.payCash"></strong><small data-i18n="order.payCashHint"></small></span></label>
                    <label class="tile"><input type="radio" name="payment" value="card" /><span class="tile-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="8.5" y="5" width="7" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M9 13h.01M12 13h.01M15 13h.01M9 16h.01M12 16h.01M15 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span class="tile-text"><strong data-i18n="order.payTerminal"></strong><small data-i18n="order.payTerminalHint"></small></span></label>
                  </div>
                  <div class="online-pay" id="onlinePay" hidden>
                    <p class="test-badge"><span aria-hidden="true">●</span> <span data-i18n="card.test"></span></p>
                    <div class="saved-cards" id="savedCards" role="radiogroup"></div>
                    <div class="new-card" id="newCard"></div>
                    <p class="hint" data-i18n="card.testHint"></p>
                    <span class="field-error" id="cardError"></span>
                  </div>
                </section>

                <div class="co-summary">
                  <dl>
                    <dt data-i18n="order.subtotal"></dt><dd id="sumSubtotal">0 ₼</dd>
                    <dt data-i18n="order.delivery"></dt><dd id="sumFee">—</dd>
                  </dl>
                  <div class="order-total"><span data-i18n="order.total"></span><strong id="sumTotal">0 ₼</strong></div>
                  <p class="hint" id="minNote" hidden></p>
                  <button type="submit" class="btn btn-primary btn-lg btn-block" id="placeOrder"><span id="placeLabel" data-i18n="order.submit"></span> <span id="btnTotal"></span></button>
                  <p class="co-secure"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="currentColor" stroke-width="1.7"/></svg><span data-i18n="order.secureNote"></span></p>
                </div>
              </form>
            </div>
          </aside>
        </div>

        <div class="order-done" id="orderDone" hidden></div>
      </div>
    </section>
  </main>

  <footer class="site-footer"></footer>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/cardform.js"></script>
  <script src="js/order.js"></script>
</body>
</html>
