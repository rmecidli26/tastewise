<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tastewise by AFA</title>
  <meta name="description" content="Tastewise by AFA — find dishes at AFA Restaurant by your favorite ingredients and budget." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="order" data-title="title.order">
  <header class="site-header"></header>

  <main>
    <section class="section" style="padding-top:1.5rem">
      <div class="leaves l-tr"></div>
      <div class="container">
        <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span data-i18n="order.badge"></span></span>
        <h1 class="order-h1" data-i18n="order.title"></h1>
        <p class="lead order-lead" data-i18n="order.sub"></p>

        <div class="order-layout" id="orderRoot">
          <section class="order-cart" aria-labelledby="cartHead">
            <div class="order-cart-head">
              <h2 id="cartHead"><span data-i18n="order.dish"></span> <span class="muted" id="itemCount"></span></h2>
              <button type="button" class="btn-text" id="clearCart" data-i18n="order.clear"></button>
            </div>
            <div class="order-cols" aria-hidden="true">
              <span data-i18n="order.dish"></span><span data-i18n="order.price"></span><span data-i18n="order.qty"></span><span data-i18n="order.sum"></span><span></span>
            </div>
            <ul class="order-list" id="orderList"></ul>
          </section>

          <aside class="order-side">
            <div class="order-summary">
              <h2 data-i18n="order.summary"></h2>
              <dl>
                <dt data-i18n="order.subtotal"></dt><dd id="sumSubtotal">0 ₼</dd>
                <dt data-i18n="order.delivery"></dt><dd id="sumFee"></dd>
              </dl>
              <div class="order-total"><span data-i18n="order.total"></span><strong id="sumTotal">0 ₼</strong></div>
              <p class="hint" id="minNote" hidden></p>
            </div>

            <div class="order-form-card">
              <h2 data-i18n="order.detailsTitle"></h2>
              <div id="orderGate"></div>
              <form class="form" id="orderForm" novalidate hidden>
                <div class="form-msg" id="orderMsg" hidden></div>
                <fieldset class="choice-group">
                  <legend data-i18n="order.how"></legend>
                  <label class="choice"><input type="radio" name="fulfillment" value="pickup" checked /><span><strong data-i18n="order.pickup"></strong><small data-i18n="order.pickupHint"></small></span></label>
                  <label class="choice"><input type="radio" name="fulfillment" value="delivery" /><span><strong data-i18n="order.deliveryOpt"></strong><small data-i18n="order.deliveryHint"></small></span></label>
                </fieldset>
                <div class="form-field" id="addressField" hidden>
                  <label for="address" data-i18n="order.address"></label>
                  <textarea class="textarea" id="address" name="address" rows="2" maxlength="300" autocomplete="street-address" data-i18n-attr="placeholder:order.addressPh"></textarea>
                  <span class="field-error"></span>
                </div>
                <div class="form-field">
                  <label for="phone" data-i18n="order.phone"></label>
                  <input class="input" type="tel" id="phone" name="phone" autocomplete="tel" placeholder="+994 50 123 45 67" required />
                  <span class="field-error"></span>
                </div>
                <fieldset class="choice-group">
                  <legend data-i18n="order.payTitle"></legend>
                  <label class="choice compact"><input type="radio" name="payment" value="cash" checked /><span><strong data-i18n="order.cash"></strong></span></label>
                  <label class="choice compact"><input type="radio" name="payment" value="card" /><span><strong data-i18n="order.card"></strong></span></label>
                  <p class="hint" style="margin:.2rem 0 0" data-i18n="order.payNote"></p>
                </fieldset>
                <div class="form-field">
                  <label for="note" data-i18n="order.note"></label>
                  <textarea class="textarea" id="note" name="note" rows="2" maxlength="500" data-i18n-attr="placeholder:order.notePh"></textarea>
                  <span class="field-error"></span>
                </div>
                <button type="submit" class="btn btn-primary btn-lg btn-block" id="placeOrder"><span data-i18n="order.submit"></span> <span id="btnTotal"></span></button>
              </form>
            </div>
          </aside>
        </div>

        <div class="order-done" id="orderDone" hidden></div>
      </div>
    </section>
  </main>

  <footer class="site-footer"></footer>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/order.js"></script>
</body>
</html>
