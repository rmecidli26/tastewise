<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tastewise by AFA</title>
  <meta name="description" content="Tastewise by AFA — find dishes at AFA Restaurant by your favorite ingredients and budget." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="reserve" data-title="title.reserve" data-nav="visit" class="has-photo-header">
  <header class="site-header"></header>

  <main>
    <section class="photo-hero dark">
      <div class="bg"><img src="images/site/table-flowers.jpg" data-i18n-attr="alt:reserve.imgAlt" alt="" fetchpriority="high" /></div>
      <div class="container">
        <div class="hero-content">
          <span class="badge on-dark"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8.5" cy="14" r="1" fill="currentColor"/><circle cx="12" cy="14" r="1" fill="currentColor"/><circle cx="15.5" cy="14" r="1" fill="currentColor"/></svg><span data-i18n="reserve.badge"></span></span>
          <h1 data-i18n="reserve.title"></h1>
          <p class="lead" data-i18n="reserve.lead"></p>
        </div>
      </div>
      <div class="wave-bottom"><svg viewBox="0 0 1440 70" preserveAspectRatio="none" aria-hidden="true"><path d="M0 70V40C260 0 520 8 760 34s470 30 680 0v36z" fill="currentColor"/></svg></div>
    </section>

    <section class="section" style="padding-top:2rem">
      <div class="leaves l-tr"></div>
      <div class="container reserve-grid">
        <div>
          <h2 style="font-size:clamp(2rem,3.5vw,2.6rem)">AFA Restaurant</h2>
          <p style="font-size:1.08rem;margin-top:.6rem" data-i18n="reserve.afaText"></p>
          <div class="tiles"><div class="tile"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18M4.5 18a7.5 7.5 0 0 1 15 0M12 7.5V6M10.5 6h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span data-i18n="tile.1"></span></div><div class="tile"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v7H7zM6 10h12v4H6zM7 14v7M17 14v7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="tile.2"></span></div><div class="tile"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span data-i18n="tile.3"></span></div><div class="tile"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12l3 5-9 11L3 9z M3 9h18M9 4l3 16M15 4l-3 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span data-i18n="tile.4"></span></div></div>
          <div class="res-photo"><img src="images/site/interior.jpg" data-i18n-attr="alt:visit.imgAlt" alt="" loading="lazy" /></div>
        </div>
        <div class="res-card" id="reserveCard">
          <div class="res-card-head"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8.5" cy="14" r="1" fill="currentColor"/><circle cx="12" cy="14" r="1" fill="currentColor"/><circle cx="15.5" cy="14" r="1" fill="currentColor"/></svg><div><h2 data-i18n="reserve.formTitle"></h2><p class="muted" data-i18n="reserve.formSub"></p></div></div>
          <div id="reserveGate"></div>
          <form class="form" id="reserveForm" novalidate hidden>
            <div class="form-msg" id="formMsg" hidden></div>
            <div class="form-row">
              <div class="form-field">
                <label for="date" data-i18n="f.date"></label>
                <div class="field-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8.5" cy="14" r="1" fill="currentColor"/><circle cx="12" cy="14" r="1" fill="currentColor"/><circle cx="15.5" cy="14" r="1" fill="currentColor"/></svg><input class="input" type="date" id="date" name="date" required /></div>
                <span class="field-error"></span>
              </div>
              <div class="form-field">
                <label for="time" data-i18n="f.time"></label>
                <div class="field-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><select class="select" id="time" name="time" required></select></div>
                <span class="field-error"></span>
              </div>
            </div>
            <div class="form-row">
              <div class="form-field">
                <label for="guests" data-i18n="f.guests"></label>
                <div class="field-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M2.5 20c.8-3.5 3.3-5.5 6.5-5.5s5.7 2 6.5 5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M15.5 4.8a3.4 3.4 0 0 1 0 6.4M18 14.8c1.8.8 3 2.6 3.5 5.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><div class="guests-box">
                  <button type="button" class="g-btn" data-g="-1" data-i18n-attr="aria-label:order.dec">−</button>
                  <input class="input" type="number" id="guests" name="guests" min="1" max="20" step="1" value="2" inputmode="numeric" required />
                  <button type="button" class="g-btn" data-g="1" data-i18n-attr="aria-label:order.inc">+</button>
                </div></div>
                <span class="hint" data-i18n="reserve.guestsHint"></span>
                <span class="field-error"></span>
              </div>
              <div class="form-field">
                <label for="phone" data-i18n="f.phone"></label>
                <div class="field-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 6 6L15 14l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><input class="input" type="tel" id="phone" name="phone" autocomplete="tel" placeholder="+994 50 123 45 67" required /></div>
                <span class="field-error"></span>
              </div>
            </div>
            <div class="form-field">
              <label for="note" data-i18n="f.note"></label>
              <textarea class="textarea" id="note" name="note" maxlength="500" data-i18n-attr="placeholder:f.notePh"></textarea>
              <span class="field-error"></span>
            </div>
            <button type="submit" class="btn btn-primary btn-lg btn-block"><span data-i18n="reserve.send"></span> <svg class="arrow" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </form>
        </div>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="container">
        <div class="info-bar light">
          <div class="info-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="9.5" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><div><strong data-i18n="info.address"></strong><span data-restaurant="address"></span></div></div>
          <div class="info-item"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><div><strong data-i18n="info.hours"></strong><span data-restaurant="hours"></span></div></div>
          <div class="info-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 6 6L15 14l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><div><strong data-i18n="info.contact"></strong><a data-restaurant="phone" href="tel:+994501234567">+994 50 123 45 67</a></div></div>
          <p class="welcome"><span data-i18n="reserve.welcome"></span> <span aria-hidden="true">♡</span></p>
        </div>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="container">
        <div class="banner">
          <img src="images/site/napkin.jpg" alt="" loading="lazy" />
          <div class="banner-text">
            <h2 data-i18n="reserve.bannerTitle"></h2>
            <p data-i18n="reserve.bannerText"></p>
            <a href="explore.html" class="btn btn-ghost"><span data-i18n="reserve.bannerCta"></span> <svg class="arrow" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer"></footer>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/reserve.js"></script>
</body>
</html>
