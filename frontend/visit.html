<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tastewise by AFA</title>
  <meta name="description" content="Tastewise by AFA — find dishes at AFA Restaurant by your favorite ingredients and budget." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="visit" data-title="title.visit" class="has-photo-header">
  <header class="site-header"></header>

  <main>
    <section class="photo-hero light">
      <div class="bg"><img src="images/site/interior-afa.jpg" data-i18n-attr="alt:visit.imgAlt" alt="" fetchpriority="high" /></div>
      <div class="leaves l-tl"></div>
      <div class="container">
        <div class="hero-content">
          <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M16 3c-2 1.5-3 4-3 7h3v11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="visit.badge"></span></span>
          <h1 data-i18n="visit.title"></h1>
          <p class="lead" data-i18n="visit.lead"></p>
          <a href="explore.html" class="btn btn-primary"><span data-i18n="visit.explore"></span> <svg class="arrow" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        </div>
      </div>
      <div class="wave-bottom"><svg viewBox="0 0 1440 70" preserveAspectRatio="none" aria-hidden="true"><path d="M0 70V40C260 0 520 8 760 34s470 30 680 0v36z" fill="currentColor"/></svg></div>
    </section>

    <section class="section" style="padding-top:2.5rem">
      <div class="leaves l-tr"></div>
      <div class="container visit-intro">
        <div>
          <h2 data-i18n="visit.aboutTitle"></h2>
          <p data-restaurant="description"></p>
          <span class="script" data-i18n="visit.slogan"></span>
        </div>
        <div class="divider"></div>
        <div class="feature-grid"><div class="feature pink"><div class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18M4.5 18a7.5 7.5 0 0 1 15 0M12 7.5V6M10.5 6h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div><h3 data-i18n="feat.1t"></h3><p data-i18n="feat.1d"></p></div><div class="feature pink"><div class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M2.5 20c.8-3.5 3.3-5.5 6.5-5.5s5.7 2 6.5 5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M15.5 4.8a3.4 3.4 0 0 1 0 6.4M18 14.8c1.8.8 3 2.6 3.5 5.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div><h3 data-i18n="feat.2t"></h3><p data-i18n="feat.2d"></p></div><div class="feature pink"><div class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></div><h3 data-i18n="feat.3t"></h3><p data-i18n="feat.3d"></p></div><div class="feature pink"><div class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="9.5" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></div><h3 data-i18n="feat.4t"></h3><p data-i18n="feat.4d"></p></div></div>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="container menu-teaser">
        <div class="teaser-img"><img src="images/site/menu-dish.jpg" data-i18n-attr="alt:visit.menuImgAlt" alt="" loading="lazy" /></div>
        <div>
          <span class="tag" data-i18n="visit.menuTag"></span>
          <h2 data-i18n="visit.menuTitle"></h2>
          <p data-i18n="visit.menuText"></p>
          <a href="explore.html" class="btn btn-primary"><span data-i18n="visit.fullMenu"></span> <svg class="arrow" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        </div>
        <div class="divider"></div>
        <div class="gallery">
          <div class="gallery-head">
            <div><span class="tag" data-i18n="visit.galleryTag"></span><h2 data-i18n="visit.galleryTitle"></h2></div>
            <div class="gallery-nav">
              <button type="button" id="galPrev" data-i18n-attr="aria-label:visit.prev"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
              <button type="button" id="galNext" data-i18n-attr="aria-label:visit.next"><svg class="arrow" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            </div>
          </div>
          <div class="gallery-track" id="galleryTrack">
            <img src="images/site/interior-afa.jpg" alt="AFA Restaurant — zal" loading="lazy" />
            <img src="images/site/interior.jpg" alt="AFA Restaurant — interyer" loading="lazy" />
            <img src="https://images.unsplash.com/photo-1709548145082-04d0cde481d4?auto=format&amp;fit=crop&amp;w=1400&amp;q=80" alt="Axşam işıqlarında zal" loading="lazy" />
            <img src="https://images.unsplash.com/photo-1778694277039-5cbf0b9a1fcf?auto=format&amp;fit=crop&amp;w=1400&amp;q=80" alt="Şam işığında axşam yeməyi" loading="lazy" />
            <img src="https://images.unsplash.com/photo-1775340965436-55ddbea71d8f?auto=format&amp;fit=crop&amp;w=1400&amp;q=80" alt="Hazırlanmış masalar" loading="lazy" />
            <img src="https://images.unsplash.com/photo-1653821355692-03666613499f?auto=format&amp;fit=crop&amp;w=1400&amp;q=80" alt="Gül və şamlarla masa" loading="lazy" />
            <img src="https://images.unsplash.com/photo-1650490632010-e18cbb694dd1?auto=format&amp;fit=crop&amp;w=1400&amp;q=80" alt="Dəyirmi masa" loading="lazy" />
            <img src="https://images.unsplash.com/photo-1670819917685-f1040e76b9b7?auto=format&amp;fit=crop&amp;w=1400&amp;q=80" alt="Taxta interyer" loading="lazy" />
            <img src="https://images.unsplash.com/photo-1666600638841-4fe4a01ae260?auto=format&amp;fit=crop&amp;w=1400&amp;q=80" alt="Masada şam" loading="lazy" />
          </div>
        </div>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="container location-grid">
        <div class="loc-col">
          <h3><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="9.5" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span data-i18n="visit.locTitle"></span></h3>
          <p><strong>AFA Restaurant</strong></p>
          <p data-restaurant="address"></p>
          <a class="btn btn-ghost btn-sm" style="margin-top:.6rem" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&amp;destination=40.3722%2C49.8443"><span data-i18n="visit.directions"></span> <svg class="arrow" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        </div>
        <div class="loc-col">
          <h3><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span data-i18n="info.hours"></span></h3>
          <p data-i18n="info.days"></p>
          <p>10:00 – 23:00</p>
        </div>
        <div class="loc-col">
          <h3><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 6 6L15 14l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span data-i18n="info.contact"></span></h3>
          <p><a data-restaurant="phone" href="tel:+994501234567">+994 50 123 45 67</a></p>
          <p><a data-restaurant="email" href="mailto:info@afa-restaurant.az">info@afa-restaurant.az</a></p>
        </div>
        <div class="map">
          <iframe data-i18n-attr="title:visit.mapTitle" loading="lazy" referrerpolicy="no-referrer-when-downgrade" tabindex="-1"
            src="https://maps.google.com/maps?q=40.3722,49.8443&amp;z=17&amp;hl=az&amp;output=embed"></iframe>
          <a class="map-link" href="https://www.google.com/maps/search/?api=1&amp;query=40.3722%2C49.8443" target="_blank" rel="noopener" data-gmaps>
            <span class="map-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="9.5" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span data-i18n="visit.mapOpen"></span></span>
          </a>
        </div>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="container"><div class="info-bar">
          <div class="info-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="9.5" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><div><strong data-i18n="info.visitUs"></strong><span data-restaurant="address"></span></div></div>
          <div class="info-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 6 6L15 14l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><div><strong data-i18n="info.contact"></strong><a data-restaurant="phone" href="tel:+994501234567">+994 50 123 45 67</a></div></div>
          <div class="info-item"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><div><strong data-i18n="info.hours"></strong><span data-restaurant="hours"></span></div></div>
          <a href="reserve.html" class="btn btn-outline-light btn-lg"><span data-i18n="visit.plan"></span> <svg class="arrow" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        </div></div>
    </section>
  </main>

  <footer class="site-footer"></footer>

  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/visit.js"></script>
</body>
</html>
